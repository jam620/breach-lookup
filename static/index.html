<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Breach Lookup · Terpel DFIR</title>
  <style>
    /* ── Variables ── */
    :root {
      --bg:           #0d1117;
      --surface:      #161b22;
      --surface2:     #21262d;
      --border:       #30363d;
      --text:         #e6edf3;
      --muted:        #8b949e;
      --accent:       #58a6ff;
      --accent-h:     #79c0ff;
      --danger:       #f85149;
      --success:      #3fb950;
      --mark-bg:      #d29922;
      --mark-text:    #0d1117;
    }
    [data-theme="light"] {
      --bg:           #f6f8fa;
      --surface:      #ffffff;
      --surface2:     #f6f8fa;
      --border:       #d0d7de;
      --text:         #24292f;
      --muted:        #57606a;
      --accent:       #0969da;
      --accent-h:     #0550ae;
      --danger:       #d1242f;
      --success:      #1a7f37;
      --mark-bg:      #ffe58f;
      --mark-text:    #24292f;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── PII Banner ── */
    .pii-banner {
      background: #5a1e1e;
      color: #fca5a5;
      text-align: center;
      padding: 5px 16px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .4px;
      border-bottom: 1px solid #7f1d1d;
      flex-shrink: 0;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    header h1 { font-size: 15px; font-weight: 700; flex: 1; }
    header h1 .brand { color: var(--accent); }
    .icon-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 5px 10px;
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
      transition: border-color .15s;
    }
    .icon-btn:hover { border-color: var(--accent); }

    /* ── Layout ── */
    .layout {
      display: grid;
      grid-template-columns: 270px 1fr;
      flex: 1;
      overflow: hidden;
    }
    @media (max-width: 768px) {
      .layout { grid-template-columns: 1fr; overflow: visible; }
      .sidebar { border-right: none; border-bottom: 1px solid var(--border); max-height: 280px; }
    }

    /* ── Sidebar ── */
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 14px;
      overflow-y: auto;
    }
    .sidebar-section { margin-bottom: 20px; }
    .sidebar-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: var(--muted);
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }
    .stat-number {
      font-size: 30px;
      font-weight: 800;
      color: var(--accent);
      line-height: 1;
    }
    .stat-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .bar-item { margin-bottom: 6px; }
    .bar-row   { display: flex; align-items: center; gap: 6px; }
    .bar-lbl   { font-size: 11px; min-width: 28px; }
    .bar-track { flex: 1; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .bar-fill  { height: 100%; background: var(--accent); border-radius: 3px; }
    .bar-cnt   { font-size: 11px; color: var(--muted); min-width: 42px; text-align: right; }

    .domain-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      padding: 2px 0;
      gap: 8px;
    }
    .domain-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .domain-cnt  { color: var(--muted); flex-shrink: 0; }

    .nulls-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1px 12px;
      font-size: 11px;
    }
    .nulls-grid .nk { color: var(--muted); }
    .nulls-grid .nv { text-align: right; }

    /* ── Main ── */
    .main { padding: 16px 20px; overflow-y: auto; }

    /* ── Search box ── */
    .search-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .search-row { display: flex; gap: 8px; }
    .search-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 14px;
      outline: none;
      transition: border-color .15s;
      min-width: 0;
    }
    .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(88,166,255,.1); }
    .field-select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 8px 8px;
      font-size: 12px;
      cursor: pointer;
      outline: none;
      flex-shrink: 0;
    }
    .search-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .search-btn:hover { background: var(--accent-h); }
    .search-btn:active { opacity: .85; }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 10px;
    }
    .chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 11px;
      cursor: pointer;
      transition: all .12s;
      user-select: none;
    }
    .chip:hover  { border-color: var(--accent); color: var(--accent); }
    .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

    /* ── Status bar ── */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      font-size: 12px;
      color: var(--muted);
      min-height: 24px;
    }
    .result-count { font-weight: 600; color: var(--text); }

    /* ── Spinner ── */
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .65s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Skeleton ── */
    .skel {
      background: var(--border);
      border-radius: 4px;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

    /* ── Results grid ── */
    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      transition: border-color .15s, box-shadow .15s;
    }
    .card:hover { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(88,166,255,.08); }
    .card-header {
      background: var(--surface2);
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .card-name { font-weight: 700; font-size: 13px; flex: 1; min-width: 0; }
    .card-doc  { font-size: 11px; color: var(--muted); font-family: monospace; flex-shrink: 0; }
    .card-body { padding: 8px 12px; }
    .f-row {
      display: flex;
      padding: 2px 4px;
      gap: 8px;
      border-radius: 3px;
      font-size: 12px;
    }
    .f-row.match {
      background: rgba(88,166,255,.1);
      margin: 0 -4px;
      padding: 2px 8px;
    }
    .f-key {
      color: var(--muted);
      min-width: 82px;
      flex-shrink: 0;
      font-size: 11px;
      padding-top: 1px;
    }
    .f-val { word-break: break-all; }
    .f-val mark {
      background: var(--mark-bg);
      color: var(--mark-text);
      border-radius: 2px;
      padding: 0 1px;
      font-style: normal;
    }
    .f-null { color: var(--border); font-style: italic; }

    /* skeleton cards */
    .card-skel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }

    /* ── Pagination ── */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 4px;
      padding-bottom: 20px;
    }
    .pg-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 12px;
      min-width: 32px;
      text-align: center;
      transition: all .12s;
    }
    .pg-btn:hover:not([disabled]) { border-color: var(--accent); color: var(--accent); }
    .pg-btn.cur { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
    .pg-btn[disabled] { opacity: .35; cursor: default; }
    .pg-dots { padding: 4px 2px; color: var(--muted); font-size: 12px; }

    /* ── Empty / error state ── */
    .state-msg {
      text-align: center;
      padding: 50px 20px;
      color: var(--muted);
    }
    .state-msg .ico { font-size: 36px; margin-bottom: 10px; }
    .state-msg p   { font-size: 14px; }
  </style>
</head>
<body>

<div class="pii-banner">
  ⚠️ INFORMACIÓN CONFIDENCIAL — Acceso restringido al equipo DFIR autorizado. Uso exclusivo para análisis de exposición de datos.
</div>

<header>
  <h1>🔍 Breach Lookup <span class="brand">· Terpel DFIR</span></h1>
  <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="Cambiar tema">☀️</button>
</header>

<div class="layout">

  <!-- ── Sidebar ── -->
  <aside class="sidebar" id="sidebar">
    <div id="statsContent">
      <!-- Skeleton mientras carga -->
      <div class="sidebar-section">
        <div class="skel" style="height:11px;width:70%;margin-bottom:10px"></div>
        <div class="skel" style="height:30px;width:50%;margin-bottom:4px"></div>
        <div class="skel" style="height:11px;width:40%"></div>
      </div>
      <div class="sidebar-section">
        <div class="skel" style="height:11px;width:60%;margin-bottom:10px"></div>
        <div class="skel" style="height:10px;margin-bottom:6px"></div>
        <div class="skel" style="height:10px;width:90%;margin-bottom:6px"></div>
        <div class="skel" style="height:10px;width:80%;margin-bottom:6px"></div>
        <div class="skel" style="height:10px;width:85%;margin-bottom:6px"></div>
        <div class="skel" style="height:10px;width:70%"></div>
      </div>
    </div>
  </aside>

  <!-- ── Main ── -->
  <main class="main">

    <div class="search-box">
      <div class="search-row">
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="Cédula, email, nombre, móvil…"
          autocomplete="off"
          onkeydown="if(event.key==='Enter') doSearch(0)"
        />
        <select id="fieldSelect" class="field-select" onchange="syncChips()">
          <option value="__all__">Todos los campos</option>
          <option value="documento">Documento</option>
          <option value="email">Email</option>
          <option value="movil">Móvil</option>
          <option value="telefono">Teléfono</option>
          <option value="nombres">Nombres</option>
          <option value="apellidos">Apellidos</option>
          <option value="usuario">Usuario</option>
        </select>
        <button class="search-btn" onclick="doSearch(0)">Buscar</button>
      </div>

      <div class="chips" id="chips">
        <span class="chip active" data-field="__all__"   onclick="selectChip(this)">Todos</span>
        <span class="chip"        data-field="documento" onclick="selectChip(this)">Documento</span>
        <span class="chip"        data-field="email"     onclick="selectChip(this)">Email</span>
        <span class="chip"        data-field="movil"     onclick="selectChip(this)">Móvil</span>
        <span class="chip"        data-field="telefono"  onclick="selectChip(this)">Teléfono</span>
        <span class="chip"        data-field="nombres"   onclick="selectChip(this)">Nombres</span>
        <span class="chip"        data-field="apellidos" onclick="selectChip(this)">Apellidos</span>
        <span class="chip"        data-field="usuario"   onclick="selectChip(this)">Usuario</span>
      </div>
    </div>

    <div class="status-bar" id="statusBar">
      <span id="resultCount" class="result-count"></span>
      <span id="spinner" class="spinner" style="display:none"></span>
    </div>

    <div class="results-grid" id="resultsGrid"></div>
    <div class="pagination"   id="pagination"></div>

    <div class="state-msg" id="emptyState">
      <div class="ico">🔍</div>
      <p>Ingresa un término y presiona <strong>Buscar</strong></p>
    </div>

  </main>
</div>

<script>
/* ── State ────────────────────────────────────────────────────── */
const LIMIT = 50;
let gQuery  = '';
let gField  = '__all__';
let gTotal  = 0;

/* ── Theme ────────────────────────────────────────────────────── */
function toggleTheme() {
  const html = document.documentElement;
  const dark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', dark ? 'light' : 'dark');
  document.getElementById('themeBtn').textContent = dark ? '🌙' : '☀️';
}

/* ── Chips / field select sync ────────────────────────────────── */
function selectChip(el) {
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('fieldSelect').value = el.dataset.field;
  gField = el.dataset.field;
}
function syncChips() {
  gField = document.getElementById('fieldSelect').value;
  document.querySelectorAll('.chip').forEach(c =>
    c.classList.toggle('active', c.dataset.field === gField)
  );
}

/* ── Stats ────────────────────────────────────────────────────── */
async function loadStats() {
  try {
    const r = await fetch('/api/stats');
    if (!r.ok) throw new Error(r.status);
    renderStats(await r.json());
  } catch {
    document.getElementById('statsContent').innerHTML =
      '<p style="color:var(--muted);font-size:12px">No se pudo cargar estadísticas.</p>';
  }
}

function renderStats(d) {
  const maxP = d.top_paises[0]?.count || 1;

  const paisBars = d.top_paises.map(p => `
    <div class="bar-item">
      <div class="bar-row">
        <span class="bar-lbl">${esc(p.value)}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${(p.count/maxP*100).toFixed(1)}%"></div></div>
        <span class="bar-cnt">${fmt(p.count)}</span>
      </div>
    </div>`).join('');

  const domList = d.top_dominios_email.map(x => `
    <div class="domain-row">
      <span class="domain-name">${esc(x.value)}</span>
      <span class="domain-cnt">${fmt(x.count)}</span>
    </div>`).join('');

  const nullEntries = Object.entries(d.nulos_por_campo)
    .filter(([, v]) => v > 0)
    .sort((a, b) => b[1] - a[1]);
  const nullRows = nullEntries.map(([k, v]) =>
    `<span class="nk">${esc(k)}</span><span class="nv">${fmt(v)}</span>`
  ).join('');

  document.getElementById('statsContent').innerHTML = `
    <div class="sidebar-section">
      <div class="sidebar-title">Total registros</div>
      <div class="stat-number">${fmt(d.total_records)}</div>
      <div class="stat-sub">registros en breach_records</div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-title">Top países</div>
      ${paisBars}
    </div>

    <div class="sidebar-section">
      <div class="sidebar-title">Top dominios email</div>
      ${domList}
    </div>

    ${nullEntries.length ? `
    <div class="sidebar-section">
      <div class="sidebar-title">Campos vacíos / nulos</div>
      <div class="nulls-grid">${nullRows}</div>
    </div>` : ''}
  `;
}

/* ── Search ───────────────────────────────────────────────────── */
async function doSearch(offset) {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) { document.getElementById('searchInput').focus(); return; }

  gQuery = q;
  gField = document.getElementById('fieldSelect').value;

  setSpinner(true);
  document.getElementById('emptyState').style.display  = 'none';
  document.getElementById('resultsGrid').innerHTML      = skeletonCards(6);
  document.getElementById('pagination').innerHTML       = '';
  document.getElementById('resultCount').textContent    = '';

  try {
    const params = new URLSearchParams({ q, field: gField, limit: LIMIT, offset });
    const r = await fetch(`/api/search?${params}`);
    if (!r.ok) {
      const e = await r.json().catch(() => ({}));
      showError(e.detail || `Error ${r.status}`);
      return;
    }
    const data = await r.json();
    gTotal = data.total;

    const from = offset + 1;
    const to   = Math.min(offset + LIMIT, data.total);
    document.getElementById('resultCount').textContent = data.total === 0
      ? '0 resultados'
      : `${fmt(data.total)} resultado${data.total !== 1 ? 's' : ''} — mostrando ${from}–${to}`;

    renderResults(data);
    renderPagination(data.total, LIMIT, offset);
  } catch {
    showError('No se pudo conectar al servidor.');
  } finally {
    setSpinner(false);
  }
}

function setSpinner(on) {
  document.getElementById('spinner').style.display = on ? 'inline-block' : 'none';
}

function showError(msg) {
  document.getElementById('resultsGrid').innerHTML =
    `<div style="color:var(--danger);padding:16px;font-size:13px">${esc(msg)}</div>`;
}

/* ── Skeleton cards ───────────────────────────────────────────── */
function skeletonCards(n) {
  const card = `<div class="card-skel">
    <div class="skel" style="height:14px;width:55%;margin-bottom:10px"></div>
    <div class="skel" style="height:11px;width:80%;margin-bottom:6px"></div>
    <div class="skel" style="height:11px;width:70%;margin-bottom:6px"></div>
    <div class="skel" style="height:11px;width:60%;margin-bottom:6px"></div>
    <div class="skel" style="height:11px;width:75%"></div>
  </div>`;
  return Array(n).fill(card).join('');
}

/* ── Render results ───────────────────────────────────────────── */
const LABELS = {
  id:'ID', nombres:'Nombres', apellidos:'Apellidos',
  documento:'Documento', fecha_nacimiento:'Nacimiento',
  email:'Email', movil:'Móvil', telefono:'Teléfono',
  pais_origen:'País', fecha_registro:'Registro',
  usuario:'Usuario', friend_terpel:'Friend Terpel',
};
const BODY_FIELDS = [
  'email','movil','telefono','pais_origen',
  'fecha_nacimiento','fecha_registro','usuario','friend_terpel',
];

function renderResults(data) {
  if (!data.results.length) {
    document.getElementById('resultsGrid').innerHTML =
      `<div class="state-msg" style="grid-column:1/-1">
         <div class="ico">🚫</div>
         <p>Sin resultados para esta búsqueda.</p>
       </div>`;
    return;
  }
  document.getElementById('resultsGrid').innerHTML =
    data.results.map(r => card(r, data.query_field)).join('');
}

function card(r, qField) {
  const fullName = [r.nombres, r.apellidos].filter(Boolean).join(' ') || '—';
  const doc      = r.documento || '—';

  const nameMatch = qField === '__all__' || qField === 'nombres' || qField === 'apellidos';
  const docMatch  = qField === '__all__' || qField === 'documento';

  const rows = BODY_FIELDS.map(key => {
    const val  = r[key] ?? '';
    const hits = qField === key || (qField === '__all__' && val && val.toLowerCase().includes(gQuery.toLowerCase()));
    const html = val
      ? (hits ? hlText(val, gQuery) : esc(val))
      : '<span class="f-null">—</span>';
    return `<div class="f-row${hits ? ' match' : ''}">
      <span class="f-key">${LABELS[key]}</span>
      <span class="f-val">${html}</span>
    </div>`;
  }).join('');

  return `<div class="card">
    <div class="card-header">
      <span class="card-name">${nameMatch ? hlText(fullName, gQuery) : esc(fullName)}</span>
      <span class="card-doc">${docMatch  ? hlText(doc, gQuery)      : esc(doc)}</span>
    </div>
    <div class="card-body">${rows}</div>
  </div>`;
}

/* ── Pagination ───────────────────────────────────────────────── */
function renderPagination(total, limit, offset) {
  const totalPages = Math.ceil(total / limit);
  if (totalPages <= 1) { document.getElementById('pagination').innerHTML = ''; return; }

  const page  = Math.floor(offset / limit);
  const pages = pageRange(page, totalPages);
  const html  = [];

  html.push(`<button class="pg-btn" ${page===0?'disabled':''} onclick="doSearch(${(page-1)*limit})">«</button>`);
  for (const p of pages) {
    if (p === '…') {
      html.push('<span class="pg-dots">…</span>');
    } else {
      html.push(`<button class="pg-btn${p===page?' cur':''}" onclick="doSearch(${p*limit})">${p+1}</button>`);
    }
  }
  html.push(`<button class="pg-btn" ${page>=totalPages-1?'disabled':''} onclick="doSearch(${(page+1)*limit})">»</button>`);

  document.getElementById('pagination').innerHTML = html.join('');
}

function pageRange(cur, total) {
  if (total <= 7) return Array.from({length: total}, (_, i) => i);
  const set = new Set([0, total-1]);
  for (let i = cur-1; i <= cur+1; i++) if (i>=0 && i<total) set.add(i);
  const sorted = [...set].sort((a,b)=>a-b);
  const out = [];
  let prev = -1;
  for (const p of sorted) {
    if (prev !== -1 && p - prev > 1) out.push('…');
    out.push(p);
    prev = p;
  }
  return out;
}

/* ── Helpers ──────────────────────────────────────────────────── */
function esc(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function hlText(text, query) {
  if (!text || !query) return esc(text ?? '');
  const str   = String(text);
  const lower = str.toLowerCase();
  const q     = query.toLowerCase();
  let out = '', last = 0, i;
  while ((i = lower.indexOf(q, last)) !== -1) {
    out += esc(str.slice(last, i));
    out += '<mark>' + esc(str.slice(i, i + query.length)) + '</mark>';
    last = i + query.length;
  }
  return out + esc(str.slice(last));
}

function fmt(n) {
  return Number(n).toLocaleString('es');
}

/* ── Init ─────────────────────────────────────────────────────── */
loadStats();
document.getElementById('searchInput').focus();
